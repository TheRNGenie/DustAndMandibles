<title>Dust &amp; Mandibles Trailer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: a single screening — the film on a wooden "screen frame", title above, a short credit line below. One dark look by choice. */
:root {
  --bg: #1f130d;
  --plank: #4a2e1d;
  --plank-edge: #2b1b17;
  --bone: #f2e3c2;
  --gold: #ffd23f;
  --dust: #c9a27a;
  --display: "Rye", "Rockwell", Georgia, serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
body {
  background: radial-gradient(120% 80% at 50% 0%, #3a2214 0%, var(--bg) 60%);
  background-color: var(--bg);
  color: var(--bone);
  font-family: var(--body);
  min-height: 100%;
}
main {
  max-width: 1100px;
  margin: 0 auto;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 18px;
}
header { display: grid; gap: 4px; text-align: center; }
h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(2rem, 6vw, 3.6rem);
  line-height: 1.05;
  color: var(--gold);
  letter-spacing: 0.02em;
  text-shadow: 0 3px 0 var(--plank-edge);
  margin: 0;
  text-wrap: balance;
}
.tag {
  margin: 0;
  font-size: 0.95rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--dust);
}
.frame {
  background: var(--plank);
  border: 3px solid var(--plank-edge);
  border-radius: 10px;
  padding: clamp(6px, 1.4vw, 14px);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
}
video {
  display: block;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 4px;
}
.meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px 20px;
  font-size: 0.95rem;
  color: var(--dust);
  font-variant-numeric: tabular-nums;
}
.meta b { color: var(--bone); font-weight: 600; }
</style>

<main>
  <header>
    <h1>Dust &amp; Mandibles</h1>
    <p class="tag">2-player co-op canyon defense</p>
  </header>
  <div class="frame">
    <video id="trailer" controls playsinline preload="metadata" poster="poster.jpg">
      <source src="trailer.mp4" type="video/mp4">
    </video>
  </div>
  <div class="meta">
    <span><b>0:31</b> trailer</span>
    <span>Filmed in-engine with the game's own sound</span>
  </div>
</main>
