# Builds the Windows game and publishes it as a GitHub Release.
# Runs when a version tag (v1.2.3) is pushed, or by hand from the Actions tab.
# The release carries the game (one .exe plus the three Epic Online Services
# DLLs that sit next to it), a zip of those four, and the small setup program
# that downloads, installs, updates and launches it.
#
# Online play (Epic lobbies + relay): add these repository secrets (Settings >
# Secrets and variables > Actions): EOS_PRODUCT_ID, EOS_SANDBOX_ID,
# EOS_DEPLOYMENT_ID, EOS_CLIENT_ID, EOS_CLIENT_SECRET. Without them the build
# still works, with direct (IP) invites only.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag for the release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: godot-dl
          key: godot-${{ env.GODOT_VERSION }}-win

      - name: Download Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $v = $env:GODOT_VERSION
          $base = "https://github.com/godotengine/godot-builds/releases/download/$v-stable"
          New-Item -ItemType Directory -Force godot-dl | Out-Null
          Invoke-WebRequest "$base/Godot_v$v-stable_win64.exe.zip" -OutFile godot-dl/godot.zip
          Invoke-WebRequest "$base/Godot_v$v-stable_export_templates.tpz" -OutFile godot-dl/templates.tpz

      - name: Install Godot and templates
        shell: pwsh
        run: |
          $v = $env:GODOT_VERSION
          Expand-Archive godot-dl/godot.zip -DestinationPath godot -Force
          $dest = Join-Path $env:APPDATA "Godot/export_templates/$v.stable"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item godot-dl/templates.tpz godot-dl/templates.zip -Force
          Expand-Archive godot-dl/templates.zip -DestinationPath tpl -Force
          Copy-Item tpl/templates/* $dest -Recurse -Force

      - name: Stamp the version
        # Online lobbies only match players on the same version (NetworkManager.game_version()).
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $lines = [System.Collections.Generic.List[string]](Get-Content project.godot)
          $lines.Insert($lines.IndexOf("[application]") + 1, "config/version=`"$tag`"")
          Set-Content project.godot $lines

      - name: Write the Epic credentials
        # Epic: remove this step (and the *.dll lines below) to drop Epic Online Services.
        # The file is gitignored and only exists inside this build's .pck.
        shell: pwsh
        env:
          EOS_PRODUCT_ID: ${{ secrets.EOS_PRODUCT_ID }}
          EOS_SANDBOX_ID: ${{ secrets.EOS_SANDBOX_ID }}
          EOS_DEPLOYMENT_ID: ${{ secrets.EOS_DEPLOYMENT_ID }}
          EOS_CLIENT_ID: ${{ secrets.EOS_CLIENT_ID }}
          EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
        run: |
          $keys = "PRODUCT_ID", "SANDBOX_ID", "DEPLOYMENT_ID", "CLIENT_ID", "CLIENT_SECRET"
          $missing = $keys | Where-Object { -not [Environment]::GetEnvironmentVariable("EOS_$_") }
          if ($missing) {
            Write-Host "::warning::No Epic credentials (missing: $($missing -join ', ')). This build has direct invites only."
            exit 0
          }
          $cfg = "[eos]`n"
          foreach ($k in $keys) { $cfg += '{0}="{1}"' -f $k.ToLower(), [Environment]::GetEnvironmentVariable("EOS_$k") ; $cfg += "`n" }
          [System.IO.File]::WriteAllText((Join-Path $PWD "eos_release.cfg"), $cfg)
          Write-Host "Epic credentials written (online lobbies on)."

      - name: Reuse the last build's imported assets
        # The full import takes a long time (models, textures, audio); Godot only
        # re-imports files whose source or settings changed since the cached copy.
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.import') }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-

      - name: Export the game
        shell: pwsh
        run: |
          $godot = (Get-ChildItem godot -Filter "*_console.exe").FullName
          New-Item -ItemType Directory -Force builds/windows | Out-Null
          & $godot --headless --path . --import | Out-Null
          & $godot --headless --path . --export-release "Windows Desktop" builds/windows/DustAndMandibles.exe
          if (-not (Test-Path builds/windows/DustAndMandibles.exe)) { throw "export failed" }
          Get-ChildItem builds/windows | Select-Object Name, Length
          Compress-Archive -Path builds/windows/* -DestinationPath builds/DustAndMandibles-windows.zip -Force

      - name: Add the setup program
        # Prebuilt from tools/installer/Setup.cs (see the build line at the top of that file).
        shell: pwsh
        run: Copy-Item tools/installer/DustAndMandiblesSetup.exe builds/DustAndMandiblesSetup.exe

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Dust & Mandibles ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            **Easiest:** download **DustAndMandiblesSetup.exe** and run it. It downloads the game, adds Desktop and Start Menu shortcuts, and starts it. The shortcut checks for updates every time you play.

            **Or** download **DustAndMandibles-windows.zip**, unzip it anywhere and run DustAndMandibles.exe. (DustAndMandibles.exe on its own also runs, but online invites need the three .dll files next to it; without them it offers direct IP invites only.)

            Windows may show a "Windows protected your PC" screen because the files are not code-signed. Click **More info**, then **Run anyway**.
          files: |
            builds/windows/DustAndMandibles.exe
            builds/windows/*.dll
            builds/DustAndMandibles-windows.zip
            builds/DustAndMandiblesSetup.exe
